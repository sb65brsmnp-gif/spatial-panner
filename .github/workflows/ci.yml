name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libopenblas-dev liblapacke-dev zlib1g-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          # The branch's own commit (on a pull request, GITHUB_SHA is the merge commit).
          SP_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          build_id="$(echo "$SP_COMMIT" | cut -c1-7) $(date -u +%Y-%m-%d)"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSP_BUILD_ID="$build_id"

      - name: Build (engine, tools, app, plugin)
        run: cmake --build build

      - name: Test (engine, app session, plugin)
        run: ctest --test-dir build --output-on-failure

      - name: Generate the demo signals (used by the demos and the editor tests)
        run: ./build/tools/gensignals/sp-gensignals signals --seconds 6

      - name: Check the app claims .spscene files (Finder double-click)
        if: runner.os == 'macOS'
        run: |
          plist="build/app/SpatialPannerApp_artefacts/Release/Spatial Panner.app/Contents/Info.plist"
          plutil -lint "$plist"
          plutil -p "$plist" | grep -q '"spscene"'
          plutil -p "$plist" | grep -q 'com.spatialpanner.scene'

      - name: Check the plugin is a universal binary
        if: runner.os == 'macOS'
        run: lipo -info "build/plugin/SpatialPannerPlugin_artefacts/Release/AU/Spatial Panner.component/Contents/MacOS/Spatial Panner" | grep -q "x86_64 arm64\|arm64 x86_64"

      - name: Validate the Audio Unit (auval)
        if: runner.os == 'macOS'
        run: scripts/install_au.sh build

      - name: Editor unit tests
        working-directory: ui
        run: npm test

      - name: Editor end-to-end tests (browser + engine analysis)
        if: runner.os == 'Linux'
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Upload editor screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: editor-screenshots
          path: ui/test-results/
          if-no-files-found: ignore

      - name: Render a demo
        run: |
          ./build/tools/render/sp-render scenes/room_walk.json -o room_walk.wav --duration 4 --bench --normalize
          ./build/tools/render/sp-render scenes/occluder.json -o occluder.wav --duration 4 --steam-threads 2 --bench --normalize
          ./build/tools/render/sp-render scenes/ambisonic_walk.json -o ambisonic_walk.wav --duration 4 --bench --normalize

      - name: Package the macOS app with the demo scenes
        if: runner.os == 'macOS'
        run: |
          pkg="build/package/Spatial Panner"
          mkdir -p "$pkg"
          ditto "build/app/SpatialPannerApp_artefacts/Release/Spatial Panner.app" "$pkg/Spatial Panner.app"
          cp -R scenes "$pkg/scenes"
          ./build/tools/gensignals/sp-gensignals "$pkg/signals" --seconds 40
          # ditto keeps the executable bits and the code signature, which the
          # artifact upload alone would drop.
          (cd build/package && ditto -c -k --keepParent "Spatial Panner" Spatial-Panner-macOS.zip)

      - name: Upload the macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: spatial-panner-macos
          path: build/package/Spatial-Panner-macOS.zip

      - name: Package the Audio Unit
        if: runner.os == 'macOS'
        run: |
          # ditto keeps the executable bits and the signature (see the app above).
          (cd "build/plugin/SpatialPannerPlugin_artefacts/Release/AU" && \
            ditto -c -k --keepParent "Spatial Panner.component" "$GITHUB_WORKSPACE/build/package/Spatial-Panner-AU.zip")

      - name: Upload the Audio Unit
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: spatial-panner-au
          path: build/package/Spatial-Panner-AU.zip
